# DRAFT — not yet verified against the real device.
#
# Target: Tuya "IR remote 2" (product_id xgahj3gjk3ftaejt, product_name GWW-RC03,
# category wnykq). Reachable via tuya-cloudcutter OTA exploit (BK7231N/T family,
# unpatched SDK assumed — not yet confirmed for this exact device/firmware).
#
# No cloudcutter device-profile exists for GWW-RC03 in the tuya-cloudcutter.github.io
# catalog (checked 2026-08-24) — flashing must go through the "by firmware version and
# name" fallback in the interactive `sudo ./tuya-cloudcutter.sh` menu, or a blind
# ESPHome-Kickstart flash (included in ~/tuya-cloudcutter/custom-firmware/ on the HA
# host). Pin numbers below are copied from the closest cataloged relative — ESPHome's
# "Tuya Generic IRC03 IR Blaster" (devices.esphome.io) — GWW-RC03 is a different
# brand prefix on the same wnykq (IR remote) category, not a confirmed pin-for-pin
# match. Verify with a pin scan (OpenBeken's autodetect, or LibreTiny's `ltchiptool`)
# once the device is reachable, then correct pins here before the final flash.

esphome:
  name: ir-module-gww-rc03
  friendly_name: "IR Remote 2"

libretiny:
  board: generic-bk7231n-qfn32-tuya
  framework:
    version: latest

logger:
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret ir_module_gww_rc03_api_key

ota:
  - platform: esphome
    password: !secret ir_module_gww_rc03_ota_password

# Placeholder pins, unverified for this exact device — see header note.
remote_transmitter:
  pin: P7
  carrier_duty_percent: 50%

remote_receiver:
  pin:
    number: P8
    inverted: true
  dump: all

binary_sensor:
  - platform: gpio
    pin:
      number: P9
      mode: INPUT_PULLUP
      inverted: true
    name: "IR Remote 2 Button"

light:
  - platform: binary
    name: "IR Remote 2 LED"
    output: led_output

output:
  - platform: gpio
    id: led_output
    pin: P24

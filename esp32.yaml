esphome:
  name: esp32-c3-ir
  friendly_name: IR Controller (ESP32-C3)
  includes:
    - ir_remote.h
  devices:
    - id: device_samsung
      name: Samsung TV
    - id: device_haier
      name: Кондиционер Haier
    - id: device_universal
      name: Universal Remote
    - id: device_lamp
      name: RGBW Lamp

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  framework:
    # Arduino framework: haier_acyrw02 depends on IRremoteESP8266 which
    # is Arduino-only. Pin to platform-espressif32 v6.x (arduino-esp32
    # v2.x) — IRremoteESP8266 2.8.4 uses the legacy hw_timer API removed
    # in arduino-esp32 v3.
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "esp32-c3-ir Fallback"
    password: "fallback123"

logger:
  # Console over the built-in USB-Serial-JTAG bridge (/dev/tty.usbmodem*).
  hardware_uart: USB_SERIAL_JTAG
ota:
  platform: esphome
api:
  # Disable batching so event triggers reach HA with minimum latency.
  batch_delay: 0ms

web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: group_samsung
      name: "Samsung TV"
      sorting_weight: 1
    - id: group_haier
      name: "Кондиционер"
      sorting_weight: 2
    - id: group_universal
      name: "Universal Remote"

debug:
  update_interval: 5s

text_sensor:
  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"

sensor:
  - platform: debug
    free:
      name: "Heap Free"
    block:
      name: "Heap Max Block"
    min_free:
      name: "Heap Min Free"
    fragmentation:
      name: "Heap Fragmentation"
    loop_time:
      name: "Loop Time"
  - platform: uptime
    name: "Uptime"
    update_interval: 5s
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 10s

globals:
  # Self-echo suppression window for Samsung IR transmits.
  - id: ir_self_ignore_until
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # NEC short-repeat tracking state (used by on_raw in universal_remote.yaml).
  # ESPHome's NEC decoder doesn't parse short-repeat frame shape (9ms + 2.25ms
  # + 560us) — it only matches the initial full frame. So on_raw reconstructs
  # repeats by matching pulse bursts that arrive shortly after a decoded NEC.
  - id: ir_last_ev
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: ir_last_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ir_repeat_cnt
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: ir_hold_fired
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ir_initial_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

packages:
  samsung: !include samsung_tv.yaml
  haier: !include haier_ac.yaml
  universal: !include universal_remote.yaml

remote_receiver:
  pin:
    number: GPIO5
    inverted: true
    mode:
      input: true
      pullup: true
  dump: all
  tolerance: 30%

output:
  - platform: ledc
    pin: GPIO4
    id: out_led_red
  - platform: ledc
    # Physical board wiring has green and white swapped: green is on IO1.
    pin: GPIO1
    id: out_led_green
  - platform: ledc
    pin: GPIO3
    id: out_led_blue
  - platform: ledc
    # Keep LED channels off ESP32-C3 strapping pins; external LED boards can
    # pull GPIO9 low at reset and leave the chip in bootloader mode.
    pin: GPIO6
    id: out_led_white

light:
  - platform: rgbw
    name: "RGBW"
    device_id: device_lamp
    red: out_led_red
    green: out_led_green
    blue: out_led_blue
    white: out_led_white

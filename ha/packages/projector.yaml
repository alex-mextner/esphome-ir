# Projector — single media device on top of the ESP IR buttons.
#
# The ESP exposes 12 raw IR buttons (button.projector_*). This package
# wraps the media-ish subset (power / play-pause / volume / mute) into one
# `universal` media_player so it reads as a single device, and models the
# power quirk: the projector turns ON with one press but needs TWO presses
# ~1s apart to turn OFF. State is ASSUMED (fire-and-forget IR has no
# feedback) — the physical projector remote can desync input_boolean below.

input_boolean:
  projector_power:
    name: Projector power (assumed)
    icon: mdi:projector

script:
  # One power frame = turn on. Mark assumed-on.
  projector_turn_on:
    alias: Projector turn on
    mode: single
    sequence:
      - action: button.press
        target: { entity_id: button.projector_power }
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.projector_power }

  # The projector requires a double power press ~3s apart to power off
  # (single press just shows the "press again to power off" OSD). Mirror
  # that here so a single media_player.turn_off actually powers it down.
  projector_turn_off:
    alias: Projector turn off
    mode: single
    sequence:
      - action: button.press
        target: { entity_id: button.projector_power }
      - delay: "00:00:03"
      - action: button.press
        target: { entity_id: button.projector_power }
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.projector_power }

media_player:
  # Commands-only universal player (no children) — state comes from the
  # assumed-power input_boolean. Volume is relative (vol±/mute buttons),
  # so no slider/level is exposed. Source cycling stays a raw button —
  # the projector can only step inputs, not jump to a named one.
  - platform: universal
    name: Projector
    unique_id: projector_ir
    device_class: tv
    commands:
      turn_on:
        action: script.projector_turn_on
      turn_off:
        action: script.projector_turn_off
      volume_up:
        action: button.press
        target: { entity_id: button.projector_vol_up }
      volume_down:
        action: button.press
        target: { entity_id: button.projector_vol_down }
      volume_mute:
        action: button.press
        target: { entity_id: button.projector_mute }
      media_play:
        action: button.press
        target: { entity_id: button.projector_play_pause }
      media_pause:
        action: button.press
        target: { entity_id: button.projector_play_pause }
      media_play_pause:
        action: button.press
        target: { entity_id: button.projector_play_pause }
    attributes:
      state: input_boolean.projector_power

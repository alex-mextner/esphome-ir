esphome:
  name: wemos-d1
  friendly_name: IR Controller
  devices:
    - id: device_samsung
      name: Samsung TV
    - id: device_haier
      name: Кондиционер Haier
    - id: device_universal
      name: Universal Remote

esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "wemos-d1 Fallback"
    password: "fallback123"

logger:
ota:
  platform: esphome
api:
  # Disable batching so event triggers reach HA with minimum latency.
  batch_delay: 0ms

web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: group_samsung
      name: "Samsung TV"
      sorting_weight: 1
    - id: group_haier
      name: "Кондиционер"
      sorting_weight: 2
    - id: group_universal
      name: "Universal Remote"

globals:
  # Self-echo suppression window for Samsung IR transmits.
  - id: ir_self_ignore_until
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # NEC short-repeat tracking state (used by on_raw in universal_remote.yaml).
  # ESPHome's NEC decoder doesn't parse short-repeat frame shape (9ms + 2.25ms
  # + 560us) — it only matches the initial full frame. So on_raw reconstructs
  # repeats by matching pulse bursts that arrive shortly after a decoded NEC.
  - id: ir_last_ev
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: ir_last_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ir_repeat_cnt
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: ir_hold_fired
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ir_initial_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

packages:
  samsung: !include samsung_tv.yaml
  haier: !include haier_ac.yaml
  universal: !include universal_remote.yaml

remote_transmitter:
  id: tx
  pin: GPIO14
  carrier_duty_percent: 50%

remote_receiver:
  pin:
    number: GPIO12 # D6
    inverted: true
    mode:
      input: true
      pullup: true
  dump: [nec]
  tolerance: 30%

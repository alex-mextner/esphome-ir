esphome:
  name: wemos-d1
  friendly_name: IR Controller
  devices:
    - id: device_samsung
      name: Samsung TV
    - id: device_haier
      name: Кондиционер Haier
    - id: device_universal
      name: Universal Remote

esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "wemos-d1 Fallback"
    password: "fallback123"

logger:
ota:
  platform: esphome
api:

web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: group_samsung
      name: "Samsung TV"
      sorting_weight: 1
    - id: group_haier
      name: "Кондиционер"
      sorting_weight: 2
    - id: group_universal
      name: "Universal Remote"

globals:
  - id: ir_self_ignore_until
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # State used by on_nec + on_raw to detect NEC repeat frames (button-hold).
  # ESPHome's NEC decoder doesn't parse standard NEC repeat shape
  # (9000us mark + 2250us space + 560us mark) — issue #6603. We catch it via
  # on_raw and synthesize repeat events from the last decoded command.
  - id: ir_last_ev
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: ir_last_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ir_repeat_cnt
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: ir_hold_fired
    type: bool
    restore_value: no
    initial_value: 'false'

packages:
  samsung: !include samsung_tv.yaml
  haier: !include haier_ac.yaml
  universal: !include universal_remote.yaml


remote_transmitter:
  pin: GPIO14
  carrier_duty_percent: 50%

remote_receiver:
  pin:
    number: GPIO12 # D6
    inverted: true
    mode:
      input: true
      pullup: true
  dump: [nec] #all

button:
  - platform: template
    name: "Power"
    device_id: device_samsung
    web_server:
      sorting_group_id: group_samsung
      sorting_weight: 1
    on_press:
      - globals.set:
          id: ir_self_ignore_until
          value: !lambda 'return millis() + 20;'
      - remote_transmitter.transmit_samsung:
          data: 0xE0E040BF


# projector.yaml
# Living-room projector — extended-NEC remote, address 0xBD00.
# Codes captured from the factory projector remote (NEC, verified against
# the receiver's own decode). Each button fires ONE leader frame via the
# shared IRsend helper (send_nec). Toggle/cycle keys (power, source) must
# never auto-repeat, so a single frame per press is deliberate.
#
# Entity ids (device "Projector"): button.projector_<name>.
# Power is special: the projector powers ON with one press but needs TWO
# presses ~3s apart to power OFF. That double-tap lives on the HA side
# (script.projector_turn_off / media_player.projector), not here — the
# firmware only knows "send the power code once".

button:
  - platform: template
    name: "Power"
    device_id: device_projector
    web_server:
      sorting_group_id: group_projector
      sorting_weight: 1
    on_press:
      - globals.set:
          id: ir_self_ignore_until
          value: !lambda 'return millis() + 120;'
      - lambda: send_nec(0xBD00, 0xFE01);

